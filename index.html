<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#080208;
    color:white;
}


/* ================= START PAGE ================= */

#start{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#start::before{
    content:"";

    position:absolute;
    inset:-20px;

    background:url("./photos/photo1.jpg")
    center/cover no-repeat;

    filter:blur(5px);

    transform:scale(1.08);

    opacity:.40;
}

#start::after{
    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(10,0,12,.75),
        rgba(90,0,50,.35),
        rgba(0,0,0,.70)
    );
}


.box{
    position:relative;

    z-index:5;

    width:min(88%,430px);

    padding:40px 25px;

    text-align:center;

    border:1px solid rgba(255,255,255,.3);

    border-radius:28px;

    background:rgba(30,0,20,.35);

    backdrop-filter:blur(10px);

    box-shadow:
    0 20px 70px rgba(0,0,0,.65);
}


.tiny{
    font:12px Arial;

    letter-spacing:4px;

    opacity:.75;

    margin-bottom:18px;
}


.box h1{
    font-size:clamp(32px,9vw,55px);

    margin-bottom:15px;
}


.box p{
    font:15px Arial;

    opacity:.85;

    margin-bottom:25px;
}


input{
    width:100%;

    padding:16px 18px;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.45);

    background:rgba(255,255,255,.12);

    color:white;

    outline:none;

    text-align:center;

    font-size:18px;
}


input::placeholder{
    color:rgba(255,255,255,.7);
}


button{
    margin-top:15px;

    padding:13px 30px;

    border:0;

    border-radius:30px;

    background:white;

    color:#8d1850;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}


#error{
    height:20px;

    margin-top:10px;

    font:13px Arial;

    color:#ffb8d5;
}


/* ================= SECOND PAGE ================= */

#surprise{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(
        circle,
        #5b0c3a,
        #18020f 58%,
        #050105
    );
}


/* ================= HELLO BANGARAM ================= */

#hello{

    position:absolute;

    z-index:20;

    text-align:center;

    font-size:clamp(40px,11vw,85px);

    text-shadow:
    0 0 15px #ff70b5,
    0 0 35px #ff70b5;

    animation:
    helloAnimation 4s ease-in-out forwards;
}


@keyframes helloAnimation{

    0%{
        transform:scale(.15);

        opacity:0;
    }

    20%{
        transform:scale(1);

        opacity:1;
    }

    70%{
        transform:scale(1.12);

        opacity:1;
    }

    100%{
        transform:scale(.25);

        opacity:0;
    }

}


/* ================= GALLERY ================= */

#gallery{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    opacity:0;

    animation:
    galleryAppear 1.5s forwards;

    animation-delay:4s;
}


@keyframes galleryAppear{

    to{
        opacity:1;
    }

}


.slide{

    position:absolute;

    width:min(90vw,650px);

    height:min(76vh,720px);

    object-fit:cover;

    border-radius:25px;

    box-shadow:
    0 15px 60px rgba(0,0,0,.75);

    opacity:0;

    animation:
    photoShow 32s infinite;
}


/* PHOTO 1 */

.slide:nth-child(1){
    animation-delay:0s;
}


/* PHOTO 2 */

.slide:nth-child(2){
    animation-delay:4s;
}


/* PHOTO 3 */

.slide:nth-child(3){
    animation-delay:8s;
}


/* PHOTO 4 */

.slide:nth-child(4){
    animation-delay:12s;
}


/* PHOTO 5 */

.slide:nth-child(5){
    animation-delay:16s;
}


/* PHOTO 6 */

.slide:nth-child(6){
    animation-delay:20s;
}


/* PHOTO 7 */

.slide:nth-child(7){
    animation-delay:24s;
}


/* PHOTO 8 */

.slide:nth-child(8){
    animation-delay:28s;
}


@keyframes photoShow{

    0%{
        opacity:0;

        transform:scale(.94);
    }

    8%{
        opacity:1;

        transform:scale(1);
    }

    23%{
        opacity:1;

        transform:scale(1.03);
    }

    31%{
        opacity:0;

        transform:scale(1.07);
    }

    100%{
        opacity:0;
    }

}


/* ================= CAPTION ================= */

.caption{

    position:absolute;

    z-index:30;

    bottom:5vh;

    padding:10px 20px;

    border-radius:30px;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(6px);

    font:15px Arial;
}


/* ================= FINAL LOVE PAGE ================= */

#loveFinal{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:
    radial-gradient(
        circle,
        #680d42,
        #18020f 65%,
        #050105
    );

    opacity:0;

    visibility:hidden;

    transition:
    opacity 1.5s ease,
    visibility 1.5s ease;
}


#loveFinal.show{

    opacity:1;

    visibility:visible;
}


#loveText{

    font-size:
    clamp(42px,12vw,90px);

    text-shadow:
    0 0 20px #ff70b5,
    0 0 45px #ff70b5;

    animation:
    loveZoom 2s ease-in-out forwards;
}


@keyframes loveZoom{

    0%{
        transform:scale(.2);

        opacity:0;
    }

    25%{
        transform:scale(1);

        opacity:1;
    }

    70%{
        transform:scale(1.08);

        opacity:1;
    }

    100%{
        transform:scale(1);

        opacity:1;
    }

}


/* ================= HEARTS ================= */

.heart{

    position:absolute;

    bottom:-30px;

    z-index:40;

    animation:
    floatHeart 7s linear forwards;
}


@keyframes floatHeart{

    to{

        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;
    }

}

</style>
</head>


<body>


<!-- ================================================= -->
<!-- START PAGE -->
<!-- ================================================= -->

<section id="start">

    <div class="box">

        <div class="tiny">
            A LITTLE SURPRISE
        </div>

        <h1>
            ❤️ Welcome ❤️
        </h1>

        <p>
            Something special is waiting for you...
        </p>

        <input
            id="name"
            type="text"
            placeholder="Enter Your Name"
            autocomplete="off"
        >

        <button onclick="enterLove()">
            Enter ❤️
        </button>

        <div id="error"></div>

    </div>

</section>



<!-- ================================================= -->
<!-- SURPRISE PAGE -->
<!-- ================================================= -->

<section id="surprise">


    <!-- HELLO BANGARAM -->

    <div id="hello">
        Bangaram ❤️
    </div>



    <!-- PHOTO GALLERY -->

    <div id="gallery">

        <img
            class="slide"
            src="./photos/photo1.jpg"
        >

        <img
            class="slide"
            src="./photos/photo2.jpg"
        >

        <img
            class="slide"
            src="./photos/photo3.jpg"
        >

        <img
            class="slide"
            src="./photos/photo4.jpg"
        >

        <img
            class="slide"
            src="./photos/photo5.jpg"
        >

        <img
            class="slide"
            src="./photos/photo6.jpg"
        >

        <img
            class="slide"
            src="./photos/photo7.jpg"
        >

        <img
            class="slide"
            src="./photos/photo8.jpg"
        >


        <div class="caption">
            Every picture has a memory… and every memory has you. ❤️
        </div>

    </div>



    <!-- FINAL MESSAGE -->

    <div id="loveFinal">

        <div id="loveText">
            Love You 😘❤️
        </div>

    </div>



    <!-- SONG -->

    <audio
        id="bgm"
        preload="auto"
        loop
    >

        <source
            src="arya2-bgm.mp3"
            type="audio/mpeg"
        >

    </audio>


</section>



<script>


/* ================================================= */
/* CORRECT NAME */
/* ================================================= */

const SECRET_NAME = "sunnyuma";



/* ================================================= */
/* ENTER */
/* ================================================= */

function enterLove(){

    const input =
    document.getElementById("name");

    const error =
    document.getElementById("error");


    /* CHECK NAME */

    if(
        input.value
        .trim()
        .toLowerCase()
        !== SECRET_NAME
    ){

        error.textContent =
        "Please enter the correct name ❤️";

        return;
    }



    /* ================================================= */
    /* START MUSIC IMMEDIATELY */
    /* ================================================= */

    const audio =
    document.getElementById("bgm");

    audio.volume = 1;

    audio.currentTime = 0;


    /*
       Because play() is called directly
       inside the button click,
       browser is much less likely
       to block the music.
    */

    audio.play().catch(function(){

        /*
           If browser still blocks it,
           user can tap once.
        */

        document.body.addEventListener(
            "click",
            function startMusic(){

                audio.play();

                document.body.removeEventListener(
                    "click",
                    startMusic
                );

            },
            {once:true}
        );

    });



    /* ================================================= */
    /* HIDE START PAGE */
    /* ================================================= */

    document
    .getElementById("start")
    .style.display="none";



    /* ================================================= */
    /* SHOW SURPRISE PAGE */
    /* ================================================= */

    document
    .getElementById("surprise")
    .style.display="flex";



    /* ================================================= */
    /* HEARTS */
    /* ================================================= */

    createHearts();



    /* ================================================= */
    /* AFTER PHOTOS */
    /*
       8 photos × 4 seconds
       = 32 seconds

       + 4 seconds hello animation
       = 36 seconds
    */
    /* ================================================= */

    setTimeout(function(){

        document
        .getElementById("loveFinal")
        .classList.add("show");

    },36000);

}



/* ================================================= */
/* ENTER KEY ALSO WORKS */
/* ================================================= */

document
.getElementById("name")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            enterLove();

        }

    }
);



/* ================================================= */
/* FLOATING HEARTS */
/* ================================================= */

function createHearts(){

    setInterval(function(){

        const heart =
        document.createElement("div");


        heart.className =
        "heart";


        heart.textContent =
        [
            "❤️",
            "💕",
            "💗",
            "💖",
            "✨"
        ]
        [
            Math.floor(
                Math.random()*5
            )
        ];


        heart.style.left =
        Math.random()*100+"vw";


        heart.style.fontSize =
        (
            15+
            Math.random()*20
        )+"px";


        document
        .getElementById("surprise")
        .appendChild(heart);


        setTimeout(
            function(){
                heart.remove();
            },
            8000
        );


    },650);

}

</script>

</body>
</html>
